<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Leitor de código de barras — MR Celulares</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:14px}.head{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:12px;background:#0369a1;display:grid;place-items:center;font-size:23px}.title{font-size:19px;font-weight:750}.sub{font-size:13px;color:#94a3b8;margin-top:2px}.panel{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px}.videoWrap{position:relative;overflow:hidden;border-radius:13px;background:#020617;min-height:220px;aspect-ratio:4/3;display:grid;place-items:center}.videoWrap video{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.aim{position:absolute;z-index:2;width:76%;height:34%;border:2px solid #38bdf8;border-radius:12px;box-shadow:0 0 0 999px #02061722;pointer-events:none}.status{font-size:14px;color:#cbd5e1;text-align:center;min-height:40px;display:grid;place-items:center}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;background:#0284c7;color:white}.btn.secondary{background:#334155;color:#f8fafc}.btn:disabled{opacity:.5}.manual{display:flex;gap:8px}.manual input{min-width:0;flex:1;border:1px solid #475569;background:#0f172a;color:white;border-radius:10px;padding:12px;font-size:16px}.small{font-size:12px;line-height:1.5;color:#94a3b8}.hidden{display:none!important}
</style>
</head>
<body><main class="app">
<header class="head"><div class="logo">▦</div><div><div class="title">MR Celulares</div><div class="sub">Leitor de código de barras</div></div></header>
<section class="panel">
<div class="videoWrap"><video id="video" autoplay muted playsinline></video><div class="aim" id="aim"></div><div id="placeholder" class="small">Toque em “Iniciar câmera” para começar.</div></div>
<p id="status" class="status" aria-live="polite">Pronto para iniciar a leitura.</p>
<button id="start" class="btn">Iniciar câmera</button>
<button id="stop" class="btn secondary hidden" style="margin-top:8px">Parar câmera</button>
</section>
<section class="panel"><div style="font-weight:700;margin-bottom:10px">Ou digite o código manualmente</div><form id="manualForm" class="manual"><input id="manualCode" autocomplete="off" placeholder="Código de barras"><button class="btn" style="width:auto">Enviar</button></form></section>
<p class="small">Ao identificar um código, esta página retorna ao MR Celulares. Se o navegador pedir permissão, escolha Permitir. A câmera só inicia após tocar no botão.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
(function(){
 const params=new URLSearchParams(location.search); const redirect=params.get('redirect');
 const video=document.getElementById('video'), status=document.getElementById('status'), start=document.getElementById('start'), stop=document.getElementById('stop'), placeholder=document.getElementById('placeholder');
 let reader=null, controls=null, busy=false;
 function say(s){status.textContent=s}
 function returnCode(code){ if(!code)return; busy=true; say('Código lido: '+code+' — retornando ao aplicativo…'); stopCamera(); if(!redirect){say('Código lido: '+code+'. Falta o endereço de retorno do aplicativo.');document.getElementById('manualCode').value=code;return;} try{const u=new URL(redirect);u.searchParams.set('code',code);location.href=u.toString()}catch(e){say('O endereço de retorno é inválido.');busy=false;} }
 async function startCamera(){
   if(!window.isSecureContext){say('A câmera exige uma página HTTPS segura.');return;}
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Este navegador não disponibiliza a câmera nesta página. Abra o link no Chrome ou Safari atualizado.');return;}
   if(!window.ZXingBrowser||!ZXingBrowser.BrowserMultiFormatReader){say('A biblioteca do leitor não carregou. Verifique a conexão com a internet e recarregue a página.');return;}
   start.disabled=true; say('Solicitando permissão para usar a câmera…');
   try{
     reader=new ZXingBrowser.BrowserMultiFormatReader();
     controls=await reader.decodeFromVideoDevice(undefined,video,(result,err)=>{if(result&&!busy){const code=result.getText?result.getText():String(result.text||'');returnCode(code)}});
     placeholder.classList.add('hidden');start.classList.add('hidden');stop.classList.remove('hidden');say('Câmera ativa. Aponte para o código de barras.');
   }catch(e){start.disabled=false;let msg='Não foi possível iniciar a câmera. Verifique as permissões do navegador.';if(e&&e.name==='NotAllowedError'||e&&e.name==='PermissionDeniedError')msg='Permissão da câmera negada. Autorize a câmera para este site nas configurações do navegador.';else if(e&&e.name==='NotFoundError')msg='Nenhuma câmera foi encontrada neste dispositivo.';else if(e&&e.name==='NotReadableError')msg='A câmera pode estar sendo usada por outro aplicativo. Feche-o e tente novamente.';say(msg)}
 }
 function stopCamera(){try{if(controls&&controls.stop)controls.stop()}catch(e){}controls=null;try{if(reader&&reader.reset)reader.reset()}catch(e){}try{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}video.srcObject=null;}
 start.addEventListener('click',startCamera);stop.addEventListener('click',()=>{stopCamera();busy=false;start.disabled=false;start.classList.remove('hidden');stop.classList.add('hidden');say('Câmera parada.');});
 document.getElementById('manualForm').addEventListener('submit',e=>{e.preventDefault();const c=document.getElementById('manualCode').value.trim();if(c)returnCode(c)});
 window.addEventListener('pagehide',stopCamera);
 if(!redirect)say('Aviso: endereço de retorno ausente. Abra o leitor pelo botão dentro do MR Celulares.');
})();
</script></body></html>
